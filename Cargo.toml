[package]
name = "johnwave"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug = "0.4.2"
nice-plug-egui = "0.6.0"
# Must match the egui version nice-plug-egui is built on.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
