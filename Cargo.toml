[package]
name = "johnwave"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
# Standalone dev app: opens the editor in its own window, no DAW needed.
# Only built with `--features standalone` (see the `dev` alias in .cargo/config.toml).
name = "johnwave-standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nice-plug/standalone"]

[dependencies]
nice-plug = "0.4.2"
nice-plug-egui = "0.6.0"
# Must match the egui version nice-plug-egui is built on.
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
